[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-modal-building-footprints"
version = "0.1.0"
description = "Building footprint extraction from imagery and backpack LiDAR"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
training = ["torch==2.6.0"]
sam = ["torch==2.6.0", "torchvision==0.21.0"]

[project.scripts]
footprint = "cli:main"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
include = ["configs", "datasets", "models", "losses", "utils", "tools"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
configs = ["*.yaml"]
